name: XSMN official-source discovery
on:
  workflow_dispatch:
  schedule:
    # 18:40 Vietnam time (11:40 UTC), after the usual afternoon draw window.
    - cron: "40 11 * * *"
permissions:
  contents: read
concurrency:
  group: xsmn-official-source-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - name: Capture result notices and original media from Council portal
        run: python scripts/collect_xsmn_official_notices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xsmn-official-source-notices
          path: xsmn_official_source_probe/
          if-no-files-found: warn
          retention-days: 90
