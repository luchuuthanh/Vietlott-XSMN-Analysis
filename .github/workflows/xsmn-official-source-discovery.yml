name: XSMN issuer websites — optional manual evidence capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - name: Capture optional issuer-site evidence
        run: python scripts/collect_xsmn_official_notices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xsmn-official-source-notices
          path: xsmn_official_source_probe/
          if-no-files-found: warn
          retention-days: 30
