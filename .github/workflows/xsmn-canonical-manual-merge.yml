name: Merge verified daily XSMN draw into canonical dataset

on:
  push:
    paths:
      - "scripts/merge_verified_xsmn_daily_into_canonical.py"
      - "data/xsmn_daily_verified_2026-11-07.csv"
      - "data/xsmn_daily_verified_2026-11-07.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsmn-canonical-manual-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install pandas
      - name: Validate and merge into the single canonical five-year dataset
        run: python scripts/merge_verified_xsmn_daily_into_canonical.py
      - name: Publish canonical dataset and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xsmn_5y_canonical.csv data/xsmn_5y_canonical.json
          if git diff --cached --quiet; then
            echo "Canonical already contains the exact verified draw."
          else
            git commit -m "Merge verified XSMN results 2026-11-07 into canonical five-year data"
            git push
          fi
