name: XSMN live source integration check

on:
  workflow_dispatch:
  push:
    paths:
      - "xsmn_live.py"
      - "xsmn_issuer_sources.py"
      - "xsmn_app.py"
      - "scripts/check_xsmn_live_source.py"
      - "scripts/publish_xsmn_daily_verified.py"
      - "scripts/validate_383_xsmn_supplement.py"
      - ".github/workflows/xsmn-live-source-check.yml"

jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live parser dependencies
        run: python -m pip install pandas requests beautifulsoup4
      - name: Compile parser and integration check
        run: python -m py_compile xsmn_live.py xsmn_issuer_sources.py xsmn_app.py scripts/check_xsmn_live_source.py scripts/publish_xsmn_daily_verified.py scripts/validate_383_xsmn_supplement.py
      - name: Fetch and validate actual live source
        run: python scripts/check_xsmn_live_source.py
