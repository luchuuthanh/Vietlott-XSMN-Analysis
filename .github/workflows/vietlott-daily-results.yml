name: Daily Vietlott results archive sync

on:
  schedule:
    # 22:30 Vietnam time, after the daily Lotto 5/35 21:00 draw.
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vietlott-daily-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and audit Vietlott archives
        run: python scripts/sync_vietlott.py

      - name: Commit updated result archives and audit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vietlott/
          if git diff --cached --quiet; then
            echo "No new Vietlott records; archive is already current."
            exit 0
          fi
          git commit -m "Daily sync Vietlott result archives"
          git push origin HEAD:main
