name: XSMN daily history sync with automatic gap recovery

on:
  workflow_dispatch:
    inputs:
      admin_recovery:
        description: "Run an immediate backfill of all missing XSMN draw dates"
        required: false
        default: "true"
        type: boolean
  push:
    paths:
      - ".github/workflows/xsmn-daily-verified-import.yml"
      - "scripts/validate_383_xsmn_supplement.py"
      - "scripts/publish_xsmn_daily_verified.py"
      - "scripts/verify_xsmn_supplement_sources_v2.py"
      - "scripts/merge_verified_daily_overlays.py"
      - "data/xsmn_daily_verified_*.csv"
      - "data/xsmn_daily_verified_*.json"
  schedule:
    - cron: "20,30,40,50 9 * * *" # 16:20-16:50 Asia/Ho_Chi_Minh
    - cron: "0,10,20,30,40,50 10 * * *" # 17:00-17:50 Asia/Ho_Chi_Minh
    - cron: "20 11-13 * * *" # 18:20, 19:20, 20:20 recovery

permissions:
  contents: write

concurrency:
  group: xsmn-daily-history-sync
  cancel-in-progress: false

jobs:
  daily-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"
      XSMN_REQUIRE_TODAY: "0"
      XSMN_DAILY_ONLY: "0"
      XSMN_BACKFILL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          export PIP_DEFAULT_TIMEOUT=10 PIP_RETRIES=1
          timeout 120s python -m pip install --no-cache-dir --upgrade pandas requests beautifulsoup4
      - name: Consolidate every PASS daily overlay into canonical history
        run: |
          python scripts/merge_verified_daily_overlays.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xsmn_5y_canonical.csv data/xsmn_5y_canonical.json
          if git diff --cached --quiet; then
            echo "No verified overlay rows need consolidation."
          else
            git commit -m "Consolidate independently verified daily XSMN history"
            git push
          fi
      - name: Determine first missing draw date
        run: |
          python - <<'PY'
          import csv
          from datetime import date, timedelta
          with open("data/xsmn_5y_canonical.csv", encoding="utf-8-sig", newline="") as f:
              latest=max(row["date"][:10] for row in csv.DictReader(f))
          start=(date.fromisoformat(latest)+timedelta(days=1)).isoformat()
          with open(__import__("os").environ["GITHUB_ENV"],"a") as f:
              f.write(f"XSMN_BACKFILL_START={start}\n")
          print(f"Canonical history ends {latest}; backfill starts {start}")
          PY
      - name: Retry backfill and current completed draw until verified
        shell: bash
        run: |
          set -uo pipefail
          deadline=$(date -d '+12 minutes' +%s)
          attempt=0
          while (( $(date +%s) < deadline )); do
            attempt=$((attempt + 1))
            echo "===== HISTORY SYNC ATTEMPT ${attempt} at $(date -Is) ====="
            rm -rf xsmn_383_probe xsmn_383_supplement xsmn_independent_audit
            mkdir -p xsmn_383_probe xsmn_independent_audit
            rm -f xsmn_daily_verified.csv
            if (
              set -e
              curl --fail --silent --show-error --location --retry 1 --connect-timeout 10 --max-time 25 \
                https://api.383.im/lottery/region/mn.json \
                -o xsmn_383_probe/region_sample.json || exit 1
              timeout 90s python scripts/validate_383_xsmn_supplement.py || exit 1
              REPORT="xsmn_383_supplement/validation_report.json"
              if [[ ! -s "$REPORT" ]]; then
                echo "::error::Validator did not create its report; this is a validation failure, not a no-new-data result."
                exit 1
              fi
              REPORT_STATUS=$(python -c 'import json; print(json.load(open("xsmn_383_supplement/validation_report.json"))["status"])') || exit 1
              if [[ "$REPORT_STATUS" != "PASS" ]]; then
                echo "::error::383 validation report is not PASS: $REPORT_STATUS"
                exit 1
              fi
              ROWS=$(python -c 'import json; print(json.load(open("xsmn_383_supplement/validation_report.json"))["rows"])') || exit 1
              API_LATEST=$(python -c 'import json; print(json.load(open("xsmn_383_supplement/validation_report.json"))["api_latest_date"])') || exit 1
              if [[ "$API_LATEST" < "$XSMN_BACKFILL_START" ]]; then
                echo "No new draw date in 383 feed yet (latest=$API_LATEST, needed=$XSMN_BACKFILL_START). Existing PASS overlays have already been consolidated; the next hourly run will retry."
                exit 0
              fi
              if [[ "$ROWS" == "0" ]]; then
                echo "No missing draw rows to append."
                exit 0
              fi
              timeout 90s python scripts/publish_xsmn_daily_verified.py --prepare || exit 1
              BACKFILL_END=$(python -c 'import json; print(json.load(open("xsmn_383_supplement/validation_report.json"))["window_end"])') || exit 1
              timeout 180s python scripts/verify_xsmn_supplement_sources_v2.py \
                --csv xsmn_daily_verified.csv \
                --out xsmn_independent_audit/backfill_comparison.csv \
                --start "$XSMN_BACKFILL_START" --end "$BACKFILL_END" || exit 1
              timeout 90s python scripts/publish_xsmn_daily_verified.py --publish || exit 1
            ); then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add data/xsmn_5y_canonical.csv data/xsmn_5y_canonical.json data/xsmn_daily_verified_*.csv data/xsmn_daily_verified_*.json
              if git diff --cached --quiet; then
                echo "All verified draw dates already exist exactly; no duplicate commit."
              else
                git commit -m "Backfill and sync independently verified XSMN history"
                git push
              fi
              echo "XSMN history sync PASS at $(date -Is)."
              exit 0
            else
              rc=$?
              echo "Validation or independent source comparison did not pass; canonical history was not changed."
            fi
            now=$(date +%s)
            if (( now >= deadline )); then break; fi
            sleep_for=45
            remaining=$((deadline-now))
            if (( remaining < sleep_for )); then sleep_for=$remaining; fi
            sleep "$sleep_for"
          done
          echo "::error::No verified backfill was committed in this run. Canonical history remains unchanged."
          exit 1
      - name: Preserve validation and independent comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-daily-history-sync
          path: |
            xsmn_383_probe/
            xsmn_383_supplement/
            xsmn_daily_verified.csv
            xsmn_independent_audit/
          if-no-files-found: warn
          retention-days: 90
