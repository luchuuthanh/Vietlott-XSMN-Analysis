name: XSMN daily history sync with automatic gap recovery
# Manual recovery restart requested 2026-11-23; verification remains fail-closed.

on:
  workflow_dispatch:
    inputs:
      admin_recovery:
        description: "Run an immediate backfill of all missing XSMN draw dates"
        required: false
        default: "true"
        type: boolean
  push:
    paths:
      - ".github/workflows/xsmn-daily-verified-import.yml"
      - "scripts/validate_383_xsmn_supplement.py"
      - "scripts/publish_xsmn_daily_verified.py"
      - "scripts/verify_xsmn_supplement_sources_v2.py"
      - "scripts/merge_verified_daily_overlays.py"
      - "scripts/archive_xsmn_from_primary_sources.py"
      - "data/xsmn_daily_verified_*.csv"
      - "data/xsmn_daily_verified_*.json"
  schedule:
    - cron: "20,30,40,45,50,55 9 * * *" # 16:20-16:55, including 16:45 confirmation
    - cron: "0,5,10,15,20,25,30 10 * * *" # 17:00-17:30 every 5 minutes (Asia/Ho_Chi_Minh)
    - cron: "35,40,45,50,55 10 * * *" # 17:35-17:55 every 5 minutes
    - cron: "0,20,40 14 * * *" # 21:00-21:40 historical recovery
    - cron: "*/5 11-13 * * *" # 18:00-20:55 every 5 minutes for pending verification/recovery

permissions:
  contents: write

concurrency:
  group: xsmn-daily-history-sync
  cancel-in-progress: false

jobs:
  daily-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"
      XSMN_REQUIRE_TODAY: "0"
      XSMN_DAILY_ONLY: "0"
      XSMN_BACKFILL: "1"
      XSMN_BROWSER_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          export PIP_DEFAULT_TIMEOUT=10 PIP_RETRIES=1
          timeout 120s python -m pip install --no-cache-dir --upgrade pandas requests beautifulsoup4
      - name: Install browser and OCR fallback
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie
          python -m py_compile scripts/archive_xsmn_from_primary_sources.py
      - name: Capture and persist today's complete live draw before historical recovery
        shell: bash
        run: |
          set -euo pipefail
          # Historical gaps must never prevent capturing the current draw.
          # The archive command can fail verification; its pending snapshot is
          # intentionally retained as UNVERIFIED and never promoted here.
          XSMN_BROWSER_FALLBACK=0 timeout 65s python scripts/archive_xsmn_from_primary_sources.py || true
          today="$(date +%F)"
          pending="data/xsmn_live_pending_${today}.json"
          if [ ! -f "$pending" ]; then
            echo "::notice::No complete live snapshot available yet."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$pending"
          if git diff --cached --quiet; then
            echo "Today's live snapshot already persisted."
            exit 0
          fi
          git commit -m "Preserve today's complete XSMN live draw before verification"
          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
              echo "Today's pending snapshot persisted."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::error::Could not persist today's pending live snapshot."
          exit 1
      - name: Verify and publish today's live draw before recovering older gaps
        shell: bash
        run: |
          set -euo pipefail
          today="$(date +%F)"
          # Today's independently verified result takes priority over historical gaps.
          # The verifier requires a complete live result and an agreeing independent publisher.
          if ! timeout 150s python scripts/archive_xsmn_from_primary_sources.py; then
            echo "::warning::Today's draw not independently verified yet; keeping any pending snapshot and continuing safely."
            exit 0
          fi
          overlay="data/xsmn_daily_verified_${today}.csv"
          evidence="data/xsmn_daily_verified_${today}.json"
          if [ ! -f "$overlay" ] || [ ! -f "$evidence" ]; then
            echo "::warning::No verified overlay for today."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          today=__import__('datetime').datetime.now(__import__('zoneinfo').ZoneInfo('Asia/Ho_Chi_Minh')).date().isoformat()
          evidence=json.loads(Path(f'data/xsmn_daily_verified_{today}.json').read_text(encoding='utf-8'))
          if evidence.get('status')!='PASS' or evidence.get('date')!=today or evidence.get('actual_rows')!=evidence.get('expected_rows') or len(evidence.get('sources',[]))<2:
              raise SystemExit('Refusing to publish an unverified daily overlay')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$overlay" "$evidence"
          if git diff --cached --quiet; then
            echo "Today's independently verified overlay already persisted."
            exit 0
          fi
          git commit -m "Persist today's independently verified XSMN results before backfill"
          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
              echo "Today's verified overlay published."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::error::Verified today's overlay could not be pushed."
          exit 1
      - name: Persist per-station independent-source diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          today="$(date +%F)"
          diagnostic="data/xsmn_verification_diagnostics_${today}.json"
          if [ ! -f "$diagnostic" ]; then
            echo "::notice::No source diagnostics generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$diagnostic"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record XSMN source-by-source diagnostics for ${today}"
          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::warning::Could not publish diagnostics; no unverified result was archived."

      - name: Consolidate every PASS daily overlay into canonical history
        run: |
          python scripts/merge_verified_daily_overlays.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xsmn_5y_canonical.csv data/xsmn_5y_canonical.json
          if git diff --cached --quiet; then
            echo "No verified overlay rows need consolidation."
          else
            git commit -m "Consolidate independently verified daily XSMN history"
            # Other live writers may update main while this job is running.
            # Rebase and retry without force-pushing or dropping history.
            for attempt in 1 2 3 4 5; do
              if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
                echo "Canonical history push confirmed."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Canonical push failed after 5 retries."
                exit 1
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
          fi
      - name: Audit canonical last draw against independently verified evidence
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          with open("data/xsmn_5y_canonical.csv",encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          manifest=json.loads(Path("data/xsmn_5y_canonical.json").read_text(encoding="utf-8"))
          latest=max(r["date"][:10] for r in rows)
          actual=[r for r in rows if r["date"][:10]==latest]
          if latest!=manifest.get("window_end") or len(rows)!=manifest.get("rows"):
              raise SystemExit(f"MANIFEST_MISMATCH: CSV latest={latest}, rows={len(rows)}; manifest latest={manifest.get('window_end')}, rows={manifest.get('rows')}")
          if len(actual)!=18*len({r["province"] for r in actual}):
              raise SystemExit(f"INCOMPLETE_LATEST_DRAW: {latest}, rows={len(actual)}")
          evidence=Path(f"data/xsmn_daily_verified_{latest}.json")
          if not evidence.exists():
              print(f"::warning::UNVERIFIED_CANONICAL_DRAW {latest}: {len(actual)} rows present, but independent verification evidence is absent. Archive PASS is NOT a verification PASS for this date.")
              with open(__import__("os").environ["GITHUB_ENV"],"a") as f:
                  f.write(f"XSMN_UNVERIFIED_LATEST={latest}\\n")
          else:
              meta=json.loads(evidence.read_text(encoding="utf-8"))
              if meta.get("status")!="PASS" or meta.get("actual_rows")!=len(actual) or len(meta.get("sources",[]))<2:
                  raise SystemExit(f"INVALID_VERIFICATION_EVIDENCE: {latest}")
              print(f"Latest draw {latest}: independent verification evidence present")
          PY
      - name: Determine first missing draw date
        run: |
          python - <<'PY'
          import csv
          from datetime import date, timedelta
          with open("data/xsmn_5y_canonical.csv", encoding="utf-8-sig", newline="") as f:
              latest=max(row["date"][:10] for row in csv.DictReader(f))
          start=(date.fromisoformat(latest)+timedelta(days=1)).isoformat()
          with open(__import__("os").environ["GITHUB_ENV"],"a") as f:
              f.write(f"XSMN_BACKFILL_START={start}\n")
          print(f"Canonical history ends {latest}; backfill starts {start}")
          PY
      - name: Verify and archive from primary independent sources (383 optional only)
        shell: bash
        run: |
          set -euo pipefail
          # Historical recovery is isolated from live draws. A 12-minute
          # retry on an older missing date previously blocked today's ingestion.
          # Evening runs and manual dispatch still perform full backfill.
          local_hour="$(TZ=Asia/Ho_Chi_Minh date +%H)"
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] && [ "$local_hour" -lt 21 ]; then
            echo "::notice::Live/pending verification window: historical backfill deferred until 21:00; today's verified overlay was processed first."
            exit 0
          fi
          deadline=$(date -d '+12 minutes' +%s)
          while (( $(date +%s) < deadline )); do
            target="$(python - <<'PY'
          import csv
          from datetime import date,timedelta
          with open('data/xsmn_5y_canonical.csv',encoding='utf-8-sig',newline='') as f:
              latest=max(row['date'][:10] for row in csv.DictReader(f))
          from pathlib import Path
          missing=(date.fromisoformat(latest)+timedelta(days=1))
          # Re-verify an existing latest draw if its evidence is missing.
          # A manifest PASS alone is not sufficient to skip this date.
          evidence=Path(f'data/xsmn_daily_verified_{latest}.json')
          if not evidence.exists():
              print(latest)
          else:
              print(missing.isoformat() if missing<=date.today() else '')
          PY
          )"
            if [ -z "$target" ]; then echo "History current through today."; exit 0; fi
            echo "Verifying earliest missing draw: $target"
            if XSMN_TARGET_DATE="$target" timeout 150s python scripts/archive_xsmn_from_primary_sources.py; then
              python scripts/merge_verified_daily_overlays.py
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add data/xsmn_5y_canonical.csv data/xsmn_5y_canonical.json data/xsmn_daily_verified_*.csv data/xsmn_daily_verified_*.json
              if git diff --cached --quiet; then
                echo "Verified draw already archived."
                exit 0
              fi
              git commit -m "Archive XSMN from independently cross-checked primary publishers"
              pushed=0
              for attempt in 1 2 3 4 5; do
                if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
                  echo "Verified XSMN history committed."
                  pushed=1
                  break
                fi
                git rebase --abort 2>/dev/null || true
                sleep 3
              done
              if [ "$pushed" -ne 1 ]; then
                echo "::error::Verified archive push failed."
                exit 1
              fi
              if [ "$target" = "$(date +%F)" ]; then exit 0; fi
              continue
            fi
            # Commit pending live capture so the next scheduled run can recover it.
            if [ -f "data/xsmn_live_pending_${target}.json" ]; then
              git add "data/xsmn_live_pending_${target}.json"
              if ! git diff --cached --quiet; then
                git commit -m "Preserve XSMN live snapshot pending independent verification"
                saved=0
                for attempt in 1 2 3 4 5; do
                  if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then saved=1; break; fi
                  git rebase --abort 2>/dev/null || true
                  sleep 3
                done
                if [ "$saved" -ne 1 ]; then
                  echo "::error::Could not persist pending live snapshot."
                  exit 1
                fi
              fi
            fi
            echo "::warning::Primary/independent source not yet verified; retry in 45 seconds. No verified history written."
            sleep 45
          done
          echo "::error::Primary and independent publishers did not verify a complete draw."
          exit 1
      - name: Enforce current draw completion after 17:35
        if: always()
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from datetime import datetime,time
          from zoneinfo import ZoneInfo
          from pathlib import Path
          now=datetime.now(ZoneInfo("Asia/Ho_Chi_Minh"))
          if now.time()<time(17,35):
              raise SystemExit(0)
          today=now.date().isoformat()
          evidence=Path(f"data/xsmn_daily_verified_{today}.json")
          if not evidence.exists():
              raise SystemExit(f"Missing verified evidence for {today}")
          meta=json.loads(evidence.read_text(encoding="utf-8"))
          expected=72 if now.weekday()==5 else 54
          with open("data/xsmn_5y_canonical.csv",encoding="utf-8-sig",newline="") as f:
              rows=[r for r in csv.DictReader(f) if r["date"][:10]==today]
          counts=Counter(r["province"] for r in rows)
          if meta.get("status")!="PASS" or meta.get("date")!=today or meta.get("actual_rows")!=expected or len(meta.get("sources",[]))<2 or len(rows)!=expected or any(n!=18 for n in counts.values()):
              raise SystemExit(f"Current draw incomplete or unverified: {today}, {dict(counts)}")
          print(f"Verified current history: {today}, {expected} rows")
          PY
      - name: Preserve validation and independent comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-daily-history-sync
          path: |
            xsmn_383_probe/
            xsmn_383_supplement/
            xsmn_daily_verified.csv
            xsmn_independent_audit/
          if-no-files-found: warn
          retention-days: 90
