name: Daily XSMN full pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xsmn-daily-full-pipeline.yml"
      - "scripts/validate_383_xsmn_supplement.py"
      - "scripts/normalize_xsmn_five_year.py"
      - "scripts/apply_xsmn_reviewed_corrections.py"
      - "scripts/verify_xsmn_supplement_sources_v2.py"
      - "scripts/audit_xsmn_archive.py"
  schedule:
    - cron: "20 9 * * *" # 16:20 Asia/Ho_Chi_Minh: start fetching before validation

permissions:
  contents: write

concurrency:
  group: xsmn-daily-publish
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Ho_Chi_Minh
      XSMN_REQUIRE_TODAY: ${{ github.event_name == 'schedule' && '1' || '0' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: python -m pip install --upgrade pandas requests beautifulsoup4
      - name: Prefetch from 16:20; begin full validation at 16:45 and recover until complete
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p xsmn_383_probe xsmn_run_status
          validation_start=$(date -d '16:45:00' +%s)
          deadline=$(date -d '17:00:00' +%s)
          recovery_deadline=$(date -d '23:00:00' +%s)
          scheduled=0
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then scheduled=1; fi
          reported=0
          attempt=0
          while true; do
            now=$(date +%s)
            # At 16:20, fetch the live feed early and refresh it every five minutes.
            # Do not run the 21-station / nine-prize validation before 16:45.
            if (( scheduled == 1 && now < validation_start )); then
              attempt=$((attempt + 1))
              rm -f xsmn_383_probe/region_sample.json
              if curl --fail --silent --show-error --location --max-time 35 https://api.383.im/lottery/region/mn.json -o xsmn_383_probe/region_sample.json; then
                echo "Prefetch attempt ${attempt} saved at $(date -Is); validation begins at 16:45."
              else
                echo "Prefetch attempt ${attempt} failed; will retry before validation."
              fi
              now=$(date +%s)
              remaining=$((validation_start - now))
              if (( remaining > 0 )); then
                sleep_for=300
                if (( remaining < sleep_for )); then sleep_for=$remaining; fi
                sleep "$sleep_for"
              fi
              continue
            fi
            attempt=$((attempt + 1))
            rm -f xsmn_383_probe/region_sample.json
            if curl --fail --silent --show-error --location --max-time 35 https://api.383.im/lottery/region/mn.json -o xsmn_383_probe/region_sample.json &&
               python scripts/validate_383_xsmn_supplement.py; then
              echo "XSMN_FEED_PASS=1" >> "$GITHUB_ENV"
              exit 0
            fi
            now=$(date +%s)
            if (( scheduled == 0 && attempt >= 2 )); then
              echo '::error::Non-scheduled validation run could not validate the latest available feed after two attempts.'
              exit 1
            fi
            if (( scheduled == 1 && now >= recovery_deadline )); then
              echo '::error::Scheduled recovery window ended at 23:00; canonical dataset remains unchanged.'
              exit 1
            fi
            if (( now >= deadline && reported == 0 )); then
              echo "::warning::17:00 report: feed is not yet complete and validated; continuing recovery."
              python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          p={"reported_at_vietnam":datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).isoformat(),
             "deadline":"17:00 Asia/Ho_Chi_Minh","status":"INCOMPLETE_AT_DEADLINE",
             "canonical_dataset_updated":False,
             "message":"Chưa đủ dữ liệu lúc 17:00; pipeline tiếp tục thử lại, bản chuẩn cũ được giữ nguyên."}
          Path("xsmn_run_status/17-00-status.json").write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
              reported=1
            fi
            sleep 300
          done
      - name: Report deadline status at 17:00 and continue late-result recovery
        if: always()
        shell: bash
        run: |
          if [ "${XSMN_FEED_PASS:-}" != "1" ]; then
            echo "::warning::17:00 report: XSMN data is not yet complete and validated. Previous canonical dataset remains unchanged; recovery is required."
            mkdir -p xsmn_run_status
            python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          p={"reported_at_vietnam":datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).isoformat(),
             "deadline":"17:00 Asia/Ho_Chi_Minh","status":"INCOMPLETE_AT_DEADLINE",
             "canonical_dataset_updated":False,
             "message":"Chưa đủ dữ liệu hoặc chưa vượt qua kiểm định lúc 17:00. Giữ nguyên bản chuẩn cũ; cần tiếp tục lấy dữ liệu và kiểm tra lại."}
          Path("xsmn_run_status/17-00-status.json").write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
          fi
      - name: Audit all quarterly five-year archive files
        run: |
          python scripts/audit_xsmn_archive.py
          python - <<'PY'
          import json,sys
          p=json.load(open('xsmn_audit/summary.json',encoding='utf-8'))
          print(json.dumps(p,ensure_ascii=False,indent=2))
          if p['quarter_count_missing_or_error'] != 0: sys.exit('Archive has missing/error quarters; refusing publication')
          if p['result_rows'] == 0 or p['actual_data_start'] is None: sys.exit('Archive is empty; refusing publication')
          if p['duplicate_rows_flagged'] or p['invalid_number_rows']: sys.exit('Archive has duplicate/invalid rows; refusing publication')
          PY
      - name: Normalize five-year archive plus complete supplement
        run: |
          python scripts/normalize_xsmn_five_year.py --archive xsmn_audit/xsmn_cleaned_rows.csv --supplement xsmn_383_supplement/xsmn_383_supplement.csv --out xsmn_5y_normalized/xsmn_5y_normalized.csv --report xsmn_5y_normalized/normalization_report.json
      - name: Apply only reviewed corrections
        run: python scripts/apply_xsmn_reviewed_corrections.py --csv xsmn_5y_normalized/xsmn_5y_normalized.csv --report xsmn_5y_normalized/reconciliation_report.json
      - name: Independently compare latest complete station results
        run: |
          LATEST=$(python -c "import json; print(json.load(open('xsmn_383_supplement/validation_report.json',encoding='utf-8'))['window_end'])")
          python scripts/verify_xsmn_supplement_sources_v2.py --csv xsmn_5y_normalized/xsmn_5y_normalized.csv --out xsmn_independent_audit/today_comparison.csv --start "$LATEST" --end "$LATEST"
      - name: Final gate and prepare app dataset
        run: |
          python - <<'PY'
          import json,sys,pandas as pd
          n=json.load(open('xsmn_5y_normalized/normalization_report.json',encoding='utf-8'))
          c=json.load(open('xsmn_5y_normalized/reconciliation_report.json',encoding='utf-8'))
          v=json.load(open('xsmn_independent_audit/today_comparison.json',encoding='utf-8'))
          a=json.load(open('xsmn_audit/summary.json',encoding='utf-8'))
          feed=json.load(open('xsmn_383_supplement/validation_report.json',encoding='utf-8'))
          checks={'normalization':n.get('status')=='PASS','corrections':c.get('status')=='PASS','independent_latest':v.get('status')=='PASS' and v.get('window_start')==feed.get('window_end') and v.get('window_end')==feed.get('window_end'),'archive_quarters':a.get('quarter_count_missing_or_error')==0}
          print(json.dumps({'checks':checks,'normalization':n,'independent_latest':v},ensure_ascii=False,indent=2))
          if not all(checks.values()): sys.exit('Final gate failed; canonical dataset will not be changed')
          df=pd.read_csv('xsmn_5y_normalized/xsmn_5y_normalized.csv',dtype={'number':str,'last2':str})
          df.to_csv('data/xsmn_5y_canonical.csv',index=False,encoding='utf-8-sig')
          open('data/xsmn_5y_canonical.json','w',encoding='utf-8').write(json.dumps({
            'status':'PASS','updated_at_vietnam':pd.Timestamp.now(tz='Asia/Ho_Chi_Minh').isoformat(),
            'window_start':n['window_start'],'window_end':n['window_end'],'rows':len(df),
            'source':'audited quarterly archive + structurally validated 383 supplement',
            'independent_check':'XoSoTin daily page for latest draw date',
            'note':'Only published after all gates pass.'
          },ensure_ascii=False,indent=2))
          PY
      - name: Publish canonical dataset for app (only after all gates pass)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xsmn_5y_canonical.csv data/xsmn_5y_canonical.json
          if git diff --cached --quiet; then
            echo "Canonical dataset already current; no commit needed."
          else
            git commit -m "Publish verified daily XSMN five-year dataset"
            git push
          fi
      - name: Write final status report for user
        if: always()
        shell: bash
        run: |
          mkdir -p xsmn_run_status
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          status = {
            "reported_at_vietnam": datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).isoformat(),
            "workflow_job_status": os.environ.get("JOB_STATUS", "see GitHub Actions run"),
            "canonical_dataset_updated": Path("data/xsmn_5y_canonical.csv").exists() and Path("data/xsmn_5y_canonical.json").exists(),
            "note": "Nếu không PASS, giữ nguyên bản dữ liệu chuẩn trước đó. Mở các báo cáo và log của run để xác định phần còn thiếu rồi hoàn thiện; không tự đánh dấu hoàn tất."
          }
          checks = {}
          for name, path in {
            "archive": "xsmn_audit/summary.json",
            "normalization": "xsmn_5y_normalized/normalization_report.json",
            "independent_source": "xsmn_independent_audit/today_comparison.json",
            "corrections": "xsmn_5y_normalized/reconciliation_report.json"
          }.items():
            p=Path(path)
            if p.exists():
              try: checks[name]=json.loads(p.read_text(encoding="utf-8"))
              except Exception as e: checks[name]={"read_error":str(e)}
            else: checks[name]={"status":"NOT_RUN_OR_NO_REPORT"}
          status["checks"]=checks
          passed=all(isinstance(v,dict) and v.get("status")=="PASS" for k,v in checks.items() if k in ("normalization","independent_source","corrections"))
          status["overall_status"]="PASS" if passed and Path("data/xsmn_5y_canonical.csv").exists() else "INCOMPLETE_NEEDS_FOLLOW_UP"
          Path("xsmn_run_status/final-status.json").write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
        env:
          JOB_STATUS: ${{ job.status }}
      - name: Preserve full run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-daily-full-pipeline
          path: |
            xsmn_383_probe/
            xsmn_383_supplement/
            xsmn_audit/
            xsmn_5y_normalized/
            xsmn_independent_audit/
            xsmn_run_status/
          if-no-files-found: warn
          retention-days: 90
