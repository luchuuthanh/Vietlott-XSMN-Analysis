name: Lottery apps validation

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "xsmn_app.py"
      - "analytics.py"
      - "data_loader.py"
      - "generator.py"
      - "data_sources.py"
      - "xsmn_archive.py"
      - "ticket_checker.py"
      - "tests/test_ticket_checker.py"
      - "scripts/backtest_vietlott.py"
      - "scripts/package_mega645.py"
      - "scripts/package_power655.py"
      - "data/vietlott/mega645_backfill_00001_00197.jsonl"
      - "data/vietlott/power655.jsonl"
      - "data/vietlott/power645.jsonl"
      - ".github/workflows/lottery-apps.yml"
  workflow_dispatch:

jobs:
  validate-lottery-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Compile both entrypoints and shared modules
        run: python -m py_compile app.py xsmn_app.py analytics.py data_loader.py generator.py data_sources.py xsmn_archive.py ticket_checker.py scripts/backtest_vietlott.py scripts/package_mega645.py scripts/package_power655.py
      - name: Run shared ticket-checker tests
        run: python -m unittest discover -s tests -p "test_ticket_checker.py" -v
      - name: Smoke-test five-year XSMN archive ingestion
        run: |
          python - <<'PY'
          from datetime import date
          from xsmn_archive import fetch_xsmn_five_years
          data, status = fetch_xsmn_five_years(date.today().isoformat())
          print(status.to_string(index=False))
          print(f"Rows: {len(data)} | Provinces: {data['province'].nunique() if not data.empty else 0}")
          if data.empty:
              raise SystemExit("No XSMN archive data loaded")
          if status["Trạng thái"].astype(str).str.startswith("Lỗi:").any():
              raise SystemExit("One or more archive quarters failed; inspect status above")
          PY
      - name: Smoke-test shared analytics
        run: |
          python - <<'PY'
          from analytics import frequency_table, gap_table, score_candidates
          from generator import make_sets
          draws = [[1, 2, 3, 4, 5, 6], [2, 3, 4, 5, 6, 7], [1, 3, 5, 7, 9, 11]]
          freq = frequency_table([n for row in draws for n in row], 55)
          gaps = gap_table(draws, 55)
          ranked = score_candidates(freq, gaps, 55, 55)
          assert not ranked.empty
          assert len(make_sets(ranked, count=6, sets=3)) > 0
          xfreq = frequency_table([1, 2, 2, 99], 99, start=0)
          xgaps = gap_table([[1, 2], [2], [99]], 99, start=0)
          assert xfreq.iloc[0]["Số"] == 2
          assert len(xgaps) == 100
          print("Lottery analytics smoke test passed.")
          PY
      - name: Run full-history expanding-window backtests for both games
        run: python scripts/backtest_vietlott.py --min-history 200 --tickets-per-draw 5
      - name: Build finalized Power 6/55 package
        run: python scripts/package_power655.py
      - name: Upload finalized Power 6/55 package
        uses: actions/upload-artifact@v4
        with:
          name: power655-final-package-${{ github.run_number }}
          path: reports/power655_final_package/
          if-no-files-found: error
          retention-days: 90
      - name: Build finalized Mega 6/45 package
        run: python scripts/package_mega645.py
      - name: Upload finalized Mega 6/45 package
        uses: actions/upload-artifact@v4
        with:
          name: mega645-final-package-${{ github.run_number }}
          path: reports/mega645_final_package/
          if-no-files-found: error
          retention-days: 90
      - name: Upload rolling backtest CSV and JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: vietlott-rolling-backtest-${{ github.run_number }}
          path: reports/rolling_backtest/
          if-no-files-found: error
          retention-days: 90
