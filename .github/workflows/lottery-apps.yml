name: Lottery apps validation

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "xsmn_app.py"
      - "analytics.py"
      - "data_loader.py"
      - "generator.py"
      - "data_sources.py"\n      - "xsmn_archive.py"
      - ".github/workflows/lottery-apps.yml"
  workflow_dispatch:

jobs:
  validate-lottery-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Compile both entrypoints and shared modules
        run: python -m py_compile app.py xsmn_app.py analytics.py data_loader.py generator.py data_sources.py
      - name: Smoke-test shared analytics
        run: |
          python - <<'PY'
          from analytics import frequency_table, gap_table, score_candidates
          from generator import make_sets
          draws = [[1, 2, 3, 4, 5, 6], [2, 3, 4, 5, 6, 7], [1, 3, 5, 7, 9, 11]]
          freq = frequency_table([n for row in draws for n in row], 55)
          gaps = gap_table(draws, 55)
          ranked = score_candidates(freq, gaps, 55, 55)
          assert not ranked.empty
          assert len(make_sets(ranked, count=6, sets=3)) > 0
          xfreq = frequency_table([1, 2, 2, 99], 99, start=0)
          xgaps = gap_table([[1, 2], [2], [99]], 99, start=0)
          assert xfreq.iloc[0]["Số"] == 2
          assert len(xgaps) == 100
          print("Lottery analytics smoke test passed.")
          PY
