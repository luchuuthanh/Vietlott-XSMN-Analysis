name: Daily Vietlott data sync

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_vietlott.py"
      - "tests/test_vietlott_sync.py"
      - "ticket_checker.py"
      - "tests/test_ticket_checker.py"
      - "app.py"
      - ".github/workflows/vietlott-daily-sync.yml"
  schedule:
    # Poll after the two daily Lotto 5/35 draws and the evening Mega/Power draws.
    # 13:45 Vietnam (06:45 UTC): after Lotto 5/35 13:00 draw.
    # 18:45 Vietnam (11:45 UTC): after Mega 6/45 / Power 6/55 18:00 draws.
    # 21:45 Vietnam (14:45 UTC): after Lotto 5/35 21:00 draw.
    # 23:45 Vietnam (16:45 UTC): end-of-day reconciliation / catch-up.
    - cron: "45 6,11,14,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vietlott-daily-data-sync
  cancel-in-progress: false

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Vietlott data validation tests
        # Keep this archive pipeline gated by the tests for the data sync itself.
        # The repository-wide suite currently contains unrelated failing tests.
        run: python -m unittest discover -s tests -p 'test_vietlott_sync.py' -v
      - name: Download, validate and audit the six selected games
        run: python scripts/sync_vietlott.py
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f data/vietlott/manifest.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          m = json.loads(Path("data/vietlott/manifest.json").read_text(encoding="utf-8"))
          print("# Vietlott daily data audit")
          print(f"**Status:** {m.get('status')}")
          print(f"**Generated (UTC):** {m.get('generated_at_utc')}")
          print("| Game | Records | First date | Latest date | ID gap warnings |")
          print("|---|---:|---|---|---:|")
          for game, x in m.get("games", {}).items():
              print(f"| {game} | {x.get('records', 0)} | {x.get('first_date','')} | {x.get('latest_date','')} | {x.get('numeric_id_gap_count_sampled',0)} |")
          for error in m.get("errors", []):
              print(f"- ERROR: {error}")
          PY
          fi
      - name: Commit updated datasets and audit manifest
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vietlott/*.jsonl data/vietlott/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily Vietlott historical data"
            if ! git pull --rebase origin main; then
              echo "Concurrent data sync detected; resolving in favor of this fully validated snapshot."
              conflicted=$(git diff --name-only --diff-filter=U)
              for path in $conflicted; do
                case "$path" in
                  data/vietlott/*)
                    git checkout --theirs -- "$path"
                    git add "$path"
                    ;;
                  *)
                    echo "Unexpected rebase conflict: $path"
                    exit 1
                    ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          else
            echo "All Vietlott snapshots are already current."
          fi
