name: XSMN algorithm tests

on:
  workflow_dispatch:
  push:
    paths:
      - "xsmn_algorithms.py"
      - "xsmn_app.py"
      - "tests/test_xsmn_algorithms.py"
      - ".github/workflows/xsmn-algorithms-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install pandas numpy streamlit
      - name: Compile XSMN modules
        run: python -m py_compile xsmn_algorithms.py xsmn_app.py
      - name: Run XSMN algorithm tests
        run: python -m unittest discover -s tests -p 'test_xsmn_algorithms.py' -v
