name: Vietlott draw-time polling and instant archive packaging

on:
  # Run once immediately when this workflow is changed, so configuration can be
  # verified without waiting for the next scheduled draw window.
  push:
    branches: [main]
    paths:
      - ".github/workflows/vietlott-draw-time-poll.yml"
  schedule:
    # All times are UTC. Viet Nam is UTC+7.
    # Lotto 5/35: 13:00 VN and 21:00 VN every day.
    - cron: "0 6,14 * * *"
    # Power 6/55 / Mega 6/45 draw window: 18:00 VN every day;
    # only the game scheduled for that weekday will produce a new record.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vietlott-draw-time-polling
  cancel-in-progress: false

jobs:
  poll-save-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package dependencies
        run: pip install -r requirements.txt

      - name: Poll every 2 minutes for up to 30 minutes; save and package as soon as a new draw appears
        id: poll
        shell: bash
        run: |
          set -u
          changed_any=0
          for attempt in $(seq 1 16); do
            echo "Polling attempt $attempt/16 at $(date -u +%FT%TZ)"
            before=$(sha256sum data/vietlott/power535.jsonl data/vietlott/power655.jsonl data/vietlott/power645.jsonl | sha256sum | cut -d' ' -f1)
            if ! python scripts/sync_vietlott.py; then
              echo "Source not ready or validation failed; retrying in 2 minutes."
            else
              after=$(sha256sum data/vietlott/power535.jsonl data/vietlott/power655.jsonl data/vietlott/power645.jsonl | sha256sum | cut -d' ' -f1)

              # sync_vietlott.py refreshes all six validated datasets. Stage the
              # complete validated snapshot so unrelated upstream file changes
              # cannot remain unstaged and break the following git rebase.
              if [ -n "$(git status --porcelain -- data/vietlott)" ]; then
                echo "Validated Vietlott snapshot changed; saving all six datasets and manifest."
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add data/vietlott/*.jsonl data/vietlott/manifest.json
                if ! git diff --cached --quiet; then
                  git commit -m "Save newly published Vietlott draw results"
                  if ! git pull --rebase origin main; then
                    conflicted=$(git diff --name-only --diff-filter=U)
                    if [ -z "$conflicted" ]; then
                      echo "Rebase failed without a resolvable data-file conflict."
                      git rebase --abort || true
                      exit 1
                    fi
                    echo "Concurrent validated snapshot detected; resolving data conflicts in favor of this run's validated snapshot."
                    for path in $conflicted; do
                      case "$path" in
                        data/vietlott/*.jsonl|data/vietlott/manifest.json)
                          git checkout --theirs -- "$path"
                          git add "$path"
                          ;;
                        *)
                          echo "Unexpected rebase conflict: $path"
                          exit 1
                          ;;
                      esac
                    done
                    GIT_EDITOR=true git rebase --continue
                  fi
                  git push origin HEAD:main
                fi
              fi

              if [ "$before" != "$after" ]; then
                echo "A target-game history changed. Running full-history backtest and rebuilding all three game packages."
                python scripts/backtest_vietlott.py --min-history 200 --tickets-per-draw 5
                python scripts/package_power535.py
                python scripts/package_power655.py
                python scripts/package_mega645.py
                changed_any=1
                echo "All three historical packages rebuilt from the latest validated snapshot."
              else
                echo "No new target-game records yet."
              fi
            fi
            if [ "$attempt" -lt 16 ]; then sleep 120; fi
          done
          echo "Polling window finished. Any detected validated snapshot was saved; target-game packages were rebuilt when target data changed."
          echo "changed_any=$changed_any" >> "$GITHUB_OUTPUT"

      - name: Upload refreshed history packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietlott-three-game-history-packages-${{ github.run_number }}
          path: |
            reports/power535_final_package/
            reports/power655_final_package/
            reports/mega645_final_package/
            reports/rolling_backtest/
          if-no-files-found: warn
          retention-days: 90
