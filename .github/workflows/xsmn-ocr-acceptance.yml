name: XSMN isolated OCR acceptance
on:
  push:
    paths:
      - '.github/workflows/xsmn-ocr-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install pandas requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie
      - name: Force screenshot OCR without HTML number extraction
        id: ocr_test
        run: |
          python - <<'PY'
          import csv,json,html,subprocess,re,unicodedata
          from pathlib import Path
          from collections import defaultdict,Counter
          from playwright.sync_api import sync_playwright
          from scripts.archive_xsmn_from_primary_sources import parse_minhngoc_station_blocks,normalize_station_key,COUNTS
          day="2026-11-28"
          expected={"tphcm","longan","haugiang","binhphuoc"}
          ref=defaultdict(list)
          reference=Path(f"reports/ocr/reference-{day}.csv")
          evidence=Path(f"reports/ocr/reference-{day}.json")
          if not evidence.exists():
              reference=Path(f"data/xsmn_daily_verified_{day}.csv")
              evidence=Path(f"data/xsmn_daily_verified_{day}.json")
          assert evidence.exists() and json.loads(evidence.read_text()).get("status")=="PASS", "Verified reference unavailable"
          with reference.open(encoding="utf-8-sig") as f:
              for r in csv.DictReader(f):
                  ref[(normalize_station_key(r["province"]),r["prize"].replace("ĐB","DB"))].append(r["number"])
          assert sum(map(len,ref.values()))==72
          assert {st for st,pr in ref}==expected
          assert all(len(ref[(st,pr)])==n for st in expected for pr,n in COUNTS.items())
          folder=Path("ocr-test");folder.mkdir(exist_ok=True)
          def norm(s):
              return re.sub(r"[^a-z0-9]","",unicodedata.normalize("NFKD",s.lower().replace("đ","d")).encode("ascii","ignore").decode())
          def ocr(image,mode="6",digits=False):
              args=["tesseract",str(image),"stdout","-l","eng" if digits else "vie+eng","--psm",mode]
              if digits: args+=["-c","tessedit_char_whitelist=0123456789"]
              return subprocess.run(args,capture_output=True,text=True,timeout=8,check=True).stdout
          def read_tables(page,name):
              # DOM supplies geometry and labels only; winning values come from pixels.
              out={}
              aliases={"giaidb":"DB","giaidacbiet":"DB","db":"DB","dacbiet":"DB","gdb":"DB","giainhat":"G1","giainhi":"G2","giaiba":"G3","giaitu":"G4","giainam":"G5","giaisau":"G6","giaibay":"G7"}
              for i in range(1,9):
                  aliases.update({f"giai{i}":f"G{i}",f"g{i}":f"G{i}",str(i):f"G{i}"})
              widths={"DB":6,"G1":5,"G2":5,"G3":5,"G4":5,"G5":4,"G6":4,"G7":3,"G8":2}
              for ti,table in enumerate(page.locator("table").all()):
                  if not table.is_visible(): continue
                  rows=table.locator("tr").all()
                  if len(rows)<9: continue
                  columns={}
                  for row in rows[:4]:
                      for j,cell in enumerate(row.locator("th,td").all()):
                          label=norm(cell.inner_text())
                          for st in expected:
                              if label==st: columns[j]=st
                  if not columns: continue
                  for ri,row in enumerate(rows):
                      cells=row.locator("th,td").all()
                      if not cells: continue
                      prize=aliases.get(norm(cells[0].inner_text()))
                      if not prize: continue
                      for j,st in columns.items():
                          if j==0 or j>=len(cells): continue
                          image=folder/f"{name}-t{ti}-r{ri}-c{j}.png"
                          cells[j].screenshot(path=str(image),timeout=5000)
                          try:
                              raw=ocr(image,"6",True)
                          except subprocess.TimeoutExpired:
                              continue
                          nums=re.findall(r"[0-9]+",raw)
                          (image.with_suffix(".txt")).write_text(raw)
                          if len(nums)==COUNTS[prize] and all(len(n)==widths[prize] for n in nums):
                              dest=out.setdefault(st,{})
                              if prize in dest and dest[prize]!=nums:
                                  raise RuntimeError("Conflicting OCR table cells")
                              dest[prize]=nums
              return out
          results=[]
          sources={"minhngoc":"https://www.minhngoc.net.vn/free/kqxs/mien-nam/28-11-2026.html","daiphat":"https://xosodaiphatvn.com/kqxsmn/28-11-2026","wiki":"https://kqxs.wiki/xsmn-28-11-2026"}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,url in sources.items():
                  report={"source":url,"method":"forced_ocr"}
                  page=browser.new_page(viewport={"width":1440,"height":1000},device_scale_factor=2,locale="vi-VN")
                  try:
                      page.goto(url,wait_until="domcontentloaded",timeout=30000)
                      page.wait_for_timeout(2000)
                      image=folder/f"{name}.png"
                      page.screenshot(path=str(image),full_page=False,timeout=15000)
                      raw=ocr(image)
                      # Date must be visible in the captured viewport; fail closed otherwise.
                      (folder/f"{name}.txt").write_text(raw)
                      parsed=read_tables(page,name)
                      # No full-page OCR fallback in this isolated test.
                      correct=wrong=missing=extra=0
                      details=[]
                      for (st,pr),nums in ref.items():
                          got=parsed.get(st,{}).get(pr,[])
                          match=sum((Counter(nums)&Counter(got)).values())
                          details.append({"station":st,"prize":pr,"correct":match,"expected":nums,"recognized":got})
                          correct+=match
                          wrong+=min(len(nums),len(got))-match
                          missing+=max(0,len(nums)-len(got))
                          extra+=max(0,len(got)-len(nums))
                      date_ok="28/11/2026" in raw or "28-11-2026" in raw
                      report.update(details=details,correct=correct,wrong=wrong,missing=missing,extra=extra,date_ok=date_ok,status="PASS" if correct==72 and not wrong and not missing and not extra and date_ok else "FAIL")
                  except Exception as e:
                      report.update(status="FAIL",error=str(e))
                  finally:
                      page.close()
                  results.append(report)
              browser.close()
          (folder/"report.json").write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False))
          if sum(r["status"]=="PASS" for r in results)<2:
              raise SystemExit("OCR acceptance requires two matching sources")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xsmn-forced-ocr-evidence
          path: ocr-test/
      - name: Publish isolated OCR test report
        if: always()
        env:
          OCR_OUTCOME: ${{ steps.ocr_test.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          source=Path("ocr-test/report.json")
          results=json.loads(source.read_text()) if source.exists() else []
          report={"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"tested_commit":os.environ["GITHUB_SHA"],"reported_at":datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).isoformat(),"draw_date":"2026-11-28","test_outcome":os.environ.get("OCR_OUTCOME"),"status":"PASS" if sum(r.get("status")=="PASS" for r in results)>=2 and os.environ.get("OCR_OUTCOME")=="success" else "FAIL" if results else "NO_RESULT","sources":results}
          folder=Path("reports/ocr");folder.mkdir(parents=True,exist_ok=True)
          (folder/f'{report["run_id"]}-{report["run_attempt"]}.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          (folder/"latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ocr/
          git commit -m "Record isolated OCR acceptance report"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
