name: Daily XSMN 383 feed validation

on:
  workflow_dispatch:
  schedule:
    # 16:35 Vietnam time, after the direct result feed is normally available around 16:20.
    - cron: "35 9 * * *"

permissions:
  contents: read

concurrency:
  group: xsmn-daily-feed-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Ho_Chi_Minh
      XSMN_REQUIRE_TODAY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch direct regional feed
        run: |
          mkdir -p xsmn_383_probe
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 45 https://api.383.im/lottery/region/mn.json -o xsmn_383_probe/region_sample.json
      - name: Validate freshness, dates, stations and all nine prize classes
        run: python scripts/validate_383_xsmn_supplement.py
      - name: Upload daily validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-daily-feed-validation
          path: |
            xsmn_383_probe/region_sample.json
            xsmn_383_supplement/
          if-no-files-found: warn
          retention-days: 90
