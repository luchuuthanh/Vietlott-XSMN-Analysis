name: Daily XSMN 383 feed validation

on:
  workflow_dispatch:
  schedule:
    # Start at 16:45 Vietnam time; retry at 16:50 and 16:55, hard stop at 17:00.
    - cron: "45 9 * * *"

permissions:
  contents: read

concurrency:
  group: xsmn-daily-feed-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      XSMN_REQUIRE_TODAY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate; retry every five minutes until 17:00 Vietnam time
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p xsmn_383_probe
          deadline=$(( $(date -d '17:00:00' +%s) ))
          attempt=0
          while (( $(date +%s) < deadline )); do
            attempt=$((attempt + 1))
            echo "::group::XSMN validation attempt ${attempt} at $(date -Is)"
            rm -f xsmn_383_probe/region_sample.json
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 40 \
              https://api.383.im/lottery/region/mn.json \
              -o xsmn_383_probe/region_sample.json; then
              if python scripts/validate_383_xsmn_supplement.py; then
                echo "XSMN_VALIDATION=PASS" >> "$GITHUB_ENV"
                echo "::notice::XSMN validation passed on attempt ${attempt} at $(date -Is)."
                echo "::endgroup::"
                exit 0
              else
                echo "Validation not passed; will fetch fresh source data and retry."
              fi
            else
              echo "Source fetch failed; will retry."
            fi
            echo "::endgroup::"
            now=$(date +%s)
            remaining=$((deadline - now))
            if (( remaining <= 0 )); then break; fi
            sleep_for=300
            if (( remaining < sleep_for )); then sleep_for=$remaining; fi
            echo "Next automatic attempt in ${sleep_for} seconds; hard stop 17:00 Asia/Ho_Chi_Minh."
            sleep "$sleep_for"
          done
          echo "::error::XSMN validation did not pass by 17:00 Vietnam time. No success status is issued."
          exit 1
      - name: Upload daily validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-daily-feed-validation
          path: |
            xsmn_383_probe/region_sample.json
            xsmn_383_supplement/
          if-no-files-found: warn
          retention-days: 90
