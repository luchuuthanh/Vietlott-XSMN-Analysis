name: XSMN archive audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xsmn-archive-audit.yml'
      - 'scripts/audit_xsmn_archive.py'
      - 'scripts/build_xsmn_66_discrepancy_ledger.py'
      - 'scripts/validate_383_xsmn_supplement.py'
      - 'scripts/normalize_xsmn_five_year.py'
  schedule:
    - cron: "30 19 * * 0"
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pandas
      - name: Download and audit five-year XSMN archive
        run: python scripts/audit_xsmn_archive.py
      - name: Build 66-group historical discrepancy ledger
        run: python scripts/build_xsmn_66_discrepancy_ledger.py --archive xsmn_audit/xsmn_cleaned_rows.csv --out xsmn_audit/xsmn_66_discrepancy_ledger.csv --report xsmn_audit/xsmn_66_discrepancy_ledger.json
      - name: Fetch 383.im supplement
        run: |
          mkdir -p xsmn_383_probe
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            https://api.383.im/lottery/region/mn.json \
            -o xsmn_383_probe/region_sample.json
      - name: Validate separate 383.im supplement
        run: python scripts/validate_383_xsmn_supplement.py
      - name: Normalize and join five-year data
        run: |
          python scripts/normalize_xsmn_five_year.py \
            --archive xsmn_audit/xsmn_cleaned_rows.csv \
            --supplement xsmn_383_supplement/xsmn_383_supplement.csv \
            --out xsmn_5y_normalized/xsmn_5y_normalized.csv \
            --report xsmn_5y_normalized/normalization_report.json
      - name: Upload normalized five-year dataset
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-five-year-normalized
          path: xsmn_5y_normalized/
          if-no-files-found: error
          retention-days: 90
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-five-year-audit
          path: xsmn_audit/
          if-no-files-found: error
          retention-days: 30
