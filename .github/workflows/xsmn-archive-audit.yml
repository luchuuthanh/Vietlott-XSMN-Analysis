name: XSMN archive audit
on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * 0"
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pandas
      - name: Download and audit five-year XSMN archive
        run: python scripts/audit_xsmn_archive.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: xsmn-five-year-audit
          path: xsmn_audit/
          if-no-files-found: error
          retention-days: 30
